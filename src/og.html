<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Link preview card</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
@font-face { font-family: "Clash Display"; src: url("../fonts/ClashDisplay-500.woff2") format("woff2"); font-weight: 500; }
html, body { margin: 0; }
body { width: 1200px; height: 627px; position: relative; overflow: hidden; background: #0F1013; color: #ECE9E3; text-align: center;
  font-family: "Bricolage Grotesque", sans-serif; }
/* the hero, as on the site: the hands, then the name, then the line */
.art { position: absolute; left: 150px; top: 6px; width: 900px; height: 367px; overflow: hidden; background: #0F1013;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 14%, #000 86%, transparent 100%); }
.art img { position: absolute; left: 0; top: -56px; width: 900px; mix-blend-mode: lighten; filter: contrast(1.08) brightness(1.06); }
.spark { position: absolute; left: 613px; top: 207px; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #D9B26F;
  box-shadow: 0 0 18px 6px rgba(217, 178, 111, .55), 0 0 60px 18px rgba(217, 178, 111, .18); }
.name { position: absolute; left: 0; right: 0; top: 352px; margin: 0; font: 500 104px/1 "Clash Display", sans-serif; letter-spacing: -.025em; word-spacing: .06em; }
.lead { position: absolute; left: 0; right: 0; top: 476px; margin: 0; font: 36px "Space Mono", monospace; letter-spacing: -.03em; }
.lead code { font: inherit; }
.lim { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; margin-right: .15em; vertical-align: top; }
.lim sub { font-size: .42em; color: #8A867E; margin-top: .25em; }
.lead em { font-style: normal; color: #D9B26F; }
.foot { position: absolute; left: 0; right: 0; bottom: 34px; margin: 0; font: 19px "Space Mono", monospace; color: #B0ACA4; letter-spacing: .02em; }
.foot i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #9DC4AF; margin-right: 10px; vertical-align: 2px; }
.foot b { font-weight: 400; color: #ECE9E3; }
</style></head><body>
<div class="art"><img src="../adam.jpg" alt=""></div>
<span class="spark"></span>
<p class="name">Aryan Awasthi</p>
<p class="lead"><span class="lim">lim<sub>n&nbsp;&rarr;&nbsp;&infin;</sub></span><code> effort(n) = <em>still going</em></code></p>
<p class="foot"><i></i>Open to ML and data roles &nbsp;/&nbsp; <b>aryanawasthi.vercel.app</b></p>
</body></html>
