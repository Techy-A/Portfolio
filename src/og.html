<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Link preview card</title>
<link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; }
body { width: 1200px; height: 627px; box-sizing: border-box; padding: 40px 64px 36px; background: #0B0B0B; color: #EDE9E2;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; overflow: hidden;
  font-family: "Times New Roman", Tinos, serif; text-align: center; }
.tag { margin: 0; font-size: 17px; letter-spacing: .22em; font-variant: small-caps; text-transform: lowercase; color: #B3ADA3; }
.tag span { color: #D4B06E; }
.name { margin: 4px 0 0; font-size: 76px; line-height: 1; font-weight: 400; }
img { width: 660px; height: auto; display: block; mix-blend-mode: lighten; }
.lead { margin: 0; font-size: 30px; font-style: italic; }
.lead em { font-style: normal; color: #D4B06E; }
</style></head><body>
<div><p class="tag">machine learning <span>/</span> ai <span>/</span> data science</p><p class="name">Aryan Awasthi</p></div>

<p class="lead">I try every reasonable answer, then <em>prove</em> which one is better.</p>
