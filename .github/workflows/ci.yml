name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Static checks (build current, ASCII only, links, no rank claims)
        run: python scripts/check.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install test tools
        run: npm ci && npx playwright install --with-deps chromium

      - name: Browser and accessibility tests (phone and desktop, both themes)
        run: npm test
